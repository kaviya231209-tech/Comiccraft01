<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft - Create Your Comic</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dceeff, #f9f1df);
            color: #1f2937;
        }
        .container {
            max-width: 720px;
            margin: 45px auto;
            padding: 30px;
            background: rgba(255,255,255,.96);
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,.12);
        }
        h1 { text-align: center; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #667085; margin-bottom: 28px; }
        label { display:block; margin: 15px 0 7px; font-weight: 700; }
        input, textarea, select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
        }
        textarea { min-height: 120px; resize: vertical; }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #1769e0;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: #0f55b9; }
        .demo-note {
            margin-top: 18px;
            padding: 12px;
            background: #fff7d6;
            border-radius: 10px;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎨 Create Your Comic</h1>
    <div class="subtitle">ComicCraft – AI Comic Story Creator using Gemini Models</div>

    <form action="/generate" method="post">
        <label for="story_prompt">Story Prompt</label>
        <textarea id="story_prompt" name="story_prompt" required
            placeholder="Example: A brave fox exploring an enchanted forest."></textarea>

        <label for="character_name">Main Character Name</label>
        <input id="character_name" name="character_name" required placeholder="Example: Finn">

        <label for="setting">Setting</label>
        <select id="setting" name="setting">
            <option>Forest</option>
            <option>School</option>
            <option>City</option>
            <option>Space</option>
            <option>Castle</option>
        </select>

        <label for="tone">Story Tone</label>
        <select id="tone" name="tone">
            <option>Funny</option>
            <option>Light-hearted</option>
            <option>Dramatic</option>
            <option>Poetic</option>
            <option>Adventure</option>
        </select>

        <label for="art_style">Art Style</label>
        <select id="art_style" name="art_style">
            <option>Comic Book</option>
            <option>Anime</option>
            <option>Pixel Art</option>
            <option>Realistic</option>
        </select>

        <button type="submit">✨ Generate Comic</button>
    </form>

    <div class="demo-note">
        <strong>Local demo mode:</strong> If API keys are not configured, ComicCraft
        still runs with demo story content and placeholder panel images.
    </div>
</div>
</body>
</html>
